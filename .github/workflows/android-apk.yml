# Builds the TeliTol Android app on GitHub's servers (they have the Android SDK)
# and publishes it as the "Android test build" release, so it can be
# downloaded straight to a phone. Runs on every change to android/ on main,
# or by hand: Actions → Android APK → Run workflow.
#
# Optional permanent signing key (lets each build install over the last one):
# add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS. Without them the APK is signed with a throwaway key.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  # Pull requests get a test build too (kept with the run, not published).
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34 build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Use the permanent signing key, if one is set
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "TELITOL_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "TELITOL_KEYSTORE_PASS=$KEYSTORE_PASSWORD"
              echo "TELITOL_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "No signing secrets set: using a throwaway debug key."
          fi

      - name: Build the APK
        env:
          TMPDIR: ${{ runner.temp }}
        # ANDROID_HOME is set by the runner image itself.
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" sh android/build-apk.sh "$GITHUB_WORKSPACE/out/TeliTol.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: TeliTol-apk
          path: out/TeliTol.apk
          retention-days: 30

      - name: Publish as the "Android test build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest out/TeliTol.apk \
            --title "Android test build" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Built automatically from ${GITHUB_SHA::7}. On your phone, open this page, tap TeliTol.apk, then open the download to install. This build loads the live site, https://telitol-67uk.vercel.app."
